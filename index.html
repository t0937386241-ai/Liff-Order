<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品線上訂購</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #f5f5f7; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
    h2 { margin-top: 0; color: #333; text-align: center; }
    .user-info { margin-bottom: 15px; padding: 10px; background: #eef6ff; border-radius: 8px; font-size: 14px; color: #1a73e8; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
    .product-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
    .product-item:last-child { border-bottom: none; }
    .product-name { font-size: 16px; }
    .product-price { color: #888; font-size: 14px; }
    .qty-input { width: 60px; padding: 5px; text-align: center; border: 1px solid #ccc; border-radius: 6px; }
    .total-box { background: #fff8f8; padding: 15px; border-radius: 8px; text-align: right; font-weight: bold; font-size: 18px; margin-bottom: 15px; color: #333; }
    #totalAmount { color: #e93524; font-size: 22px; margin: 0 5px; }
    button { width: 100%; padding: 12px; background: #06C755; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #ccc; }
  </style>
</head>
<body>

<div class="card">
  <h2>專屬訂購單</h2>
  <div class="user-info" id="userDisplay">正在驗證 LINE 身分...</div>
  
  <!-- 💡 在這裡加入你想說明的文字區塊 -->
  <div class="notice-box" style="background: #fff3cd; padding: 12px; border-radius: 8px; margin-bottom: 15px; color: #856404; font-size: 14px;">
    <strong>📢 訂購須知：</strong><br>
    本週手工山城蛋餅皮新鮮製作，歡迎大家多加利用此表單快速登記！如有任何疑問請私訊聯繫。
  </div>

  <!-- 下方原本的 16 個品項與數量加減列表 -->
  <div id="product-list">
    <!-- 商品清單動態生成或靜態排版 -->
  </div>
</div>

  <form id="orderForm">    
    <div class="form-group">
      <label>訂購品項 (請填寫數量)</label>
      
      <!-- 16個品項 -->
      <div class="product-item"><div><div class="product-name">紅豆</div><div class="product-price">$48 / 顆</div></div><input type="number" id="qty1" class="qty-input" data-price="48" min="0" value="0"></div>
      <div class="product-item"><div><div class="product-name">芋泥</div><div class="product-price">$48 / 顆</div></div><input type="number" id="qty2" class="qty-input" data-price="48" min="0" value="0"></div>
      <div class="product-item"><div><div class="product-name">乳酪丁</div><div class="product-price">$48 / 顆</div></div><input type="number" id="qty3" class="qty-input" data-price="48" min="0" value="0"></div>
      <div class="product-item"><div><div class="product-name">花生</div><div class="product-price">$48 / 顆</div></div><input type="number" id="qty4" class="qty-input" data-price="48" min="0" value="0"></div>
      <div class="product-item"><div><div class="product-name">巧克力</div><div class="product-price">$48 / 顆</div></div><input type="number" id="qty5" class="qty-input" data-price="48" min="0" value="0"></div>
      <div class="product-item"><div><div class="product-name">奶酥</div><div class="product-price">$53 / 顆</div></div><input type="number" id="qty6" class="qty-input" data-price="53" min="0" value="0"></div>
      <div class="product-item"><div><div class="product-name">黑芝麻</div><div class="product-price">$51 / 顆</div></div><input type="number" id="qty7" class="qty-input" data-price="51" min="0" value="0"></div>
      <div class="product-item"><div><div class="product-name">綠豆</div><div class="product-price">$51 / 顆</div></div><input type="number" id="qty8" class="qty-input" data-price="51" min="0" value="0"></div>
      <div class="product-item"><div><div class="product-name">肉鬆</div><div class="product-price">$51 / 顆</div></div><input type="number" id="qty9" class="qty-input" data-price="51" min="0" value="0"></div>
      <div class="product-item"><div><div class="product-name">鹹蛋芋頭</div><div class="product-price">$58 / 顆</div></div><input type="number" id="qty10" class="qty-input" data-price="58" min="0" value="0"></div>
      <div class="product-item"><div><div class="product-name">蔓越莓乳酪丁</div><div class="product-price">$58 / 顆</div></div><input type="number" id="qty11" class="qty-input" data-price="58" min="0" value="0"></div>
      <div class="product-item"><div><div class="product-name">草莓奶酥</div><div class="product-price">$58 / 顆</div></div><input type="number" id="qty12" class="qty-input" data-price="58" min="0" value="0"></div>
      <div class="product-item"><div><div class="product-name">起司奶酥</div><div class="product-price">$58 / 顆</div></div><input type="number" id="qty13" class="qty-input" data-price="58" min="0" value="0"></div>
      <div class="product-item"><div><div class="product-name">🎉抹茶奶酥芋泥</div><div class="product-price">$58 / 顆</div></div><input type="number" id="qty14" class="qty-input" data-price="58" min="0" value="0"></div>
      <div class="product-item"><div><div class="product-name">🎉黑糖肉桂奶酥</div><div class="product-price">$58 / 顆</div></div><input type="number" id="qty15" class="qty-input" data-price="58" min="0" value="0"></div>
      <div class="product-item"><div><div class="product-name">🎉黑糖麻吉</div><div class="product-price">$53 / 顆</div></div><input type="number" id="qty16" class="qty-input" data-price="53" min="0" value="0"></div>
    </div>

    <!-- 總計金額 -->
    <div class="total-box">
      總計：<span id="totalAmount">0</span> 元
    </div>
    
    <button type="submit" id="submitBtn" disabled>確認提交訂單</button>
  </form>
</div>

<script>
  const MY_LIFF_ID = "2012419596-l7jcyOIj"; // 填入你的 LIFF ID
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxZflNqYLbreKzYventNg6gEjx7HNY8jlthE0S5rtame8XhnDsv15MFUWeGhK6wtjHGLw/exec"; // 填入你的 GAS 網址

  let currentUser = { userId: "", displayName: "" };
  let finalTotal = 0;

  const qtyInputs = document.querySelectorAll('.qty-input');
  const totalDisplay = document.getElementById('totalAmount');

  function calculateTotal() {
    finalTotal = 0;
    qtyInputs.forEach(input => {
      const qty = parseInt(input.value) || 0;
      const price = parseInt(input.getAttribute('data-price')) || 0;
      finalTotal += (qty * price);
    });
    totalDisplay.innerText = finalTotal;
  }

  qtyInputs.forEach(input => {
    input.addEventListener('input', calculateTotal);
  });

  async function main() {
    try {
      await liff.init({ liffId: MY_LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      
      const profile = await liff.getProfile();
      currentUser.userId = profile.userId;
      currentUser.displayName = profile.displayName;
      
      document.getElementById("userDisplay").innerText = `訂購帳號：${profile.displayName}`;
      document.getElementById("submitBtn").disabled = false;
    } catch (err) {
      document.getElementById("userDisplay").innerText = "LINE 驗證失敗，請重新整理或在 LINE 內開啟";
    }
  }

  document.getElementById("orderForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    
    let totalQty = 0;
    qtyInputs.forEach(input => {
      totalQty += parseInt(input.value) || 0;
    });

    if (totalQty === 0) {
      alert("請至少選擇一項商品數量！");
      return;
    }

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.innerText = "訂單傳送中...";

    // 封裝資料（帶入 LINE 暱稱與 ID）
    const payload = {
      userId: currentUser.userId,
      displayName: currentUser.displayName,
      item1: parseInt(document.getElementById("qty1").value) || 0,
      item2: parseInt(document.getElementById("qty2").value) || 0,
      item3: parseInt(document.getElementById("qty3").value) || 0,
      item4: parseInt(document.getElementById("qty4").value) || 0,
      item5: parseInt(document.getElementById("qty5").value) || 0,
      item6: parseInt(document.getElementById("qty6").value) || 0,
      item7: parseInt(document.getElementById("qty7").value) || 0,
      item8: parseInt(document.getElementById("qty8").value) || 0,
      item9: parseInt(document.getElementById("qty9").value) || 0,
      item10: parseInt(document.getElementById("qty10").value) || 0,
      item11: parseInt(document.getElementById("qty11").value) || 0,
      item12: parseInt(document.getElementById("qty12").value) || 0,
      item13: parseInt(document.getElementById("qty13").value) || 0,
      item14: parseInt(document.getElementById("qty14").value) || 0,
      item15: parseInt(document.getElementById("qty15").value) || 0,
      item16: parseInt(document.getElementById("qty16").value) || 0,
      totalAmount: finalTotal
    };

    try {
      const fetchPromise = fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      const delayPromise = new Promise(resolve => setTimeout(resolve, 2000));

      const [resp] = await Promise.all([fetchPromise, delayPromise]);
      const resData = await resp.json();
      
      if (resData.status === "success") {
        btn.innerText = "訂單已傳送！";
        alert(`訂單建立成功！單號：${resData.orderId}`);
        liff.closeWindow();
      } else {
        alert("提交失敗，請重試：" + (resData.message || ''));
        btn.disabled = false;
        btn.innerText = "確認提交訂單";
      }
    } catch (err) {
      alert("傳送發生錯誤，請檢查網路連線或重試");
      btn.disabled = false;
      btn.innerText = "確認提交訂單";
    }
  });

  main();
</script>
</body>
</html>

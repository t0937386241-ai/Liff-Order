<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品線上訂購單</title>
  <!-- 引入 LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f7f9fa;
      margin: 0;
      padding: 16px;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    h2 {
      text-align: center;
      color: #2c3e50;
      margin-top: 0;
    }
    /* LINE 帳號顯示區塊樣式 */
    .user-profile {
      display: flex;
      align-items: center;
      background: #e8f5e9;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 15px;
      gap: 10px;
    }
    .user-profile img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }
    .user-info-text span {
      font-size: 13px;
      color: #666;
      display: block;
    }
    .user-info-text strong {
      font-size: 15px;
      color: #2e7d32;
    }
    /* 公告說明區塊 */
    .notice-box {
      background: #fff3cd;
      border: 1px solid #ffeeba;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      color: #856404;
      font-size: 14px;
      line-height: 1.5;
    }
    .product-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }
    .product-info h3 {
      margin: 0 0 4px 0;
      font-size: 16px;
    }
    .product-price {
      margin: 0;
      color: #333;
      font-weight: normal;
      font-size: 14px;
    }
    .quantity-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .quantity-control button {
      width: 32px;
      height: 32px;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .quantity-control button:active {
      background: #eee;
    }
    .quantity-control span {
      font-size: 16px;
      font-weight: bold;
      min-width: 24px;
      text-align: center;
    }
    /* 結算區塊 */
    .checkout-summary {
      margin-top: 20px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 16px;
    }
    .summary-row.total-qty {
      font-size: 18px;
      font-weight: bold;
      color: #0000CC;
      border-top: 1px dashed #ddd;
      padding-top: 8px;
      margin-top: 8px;
    }      
    .summary-row.total-amount {
      font-size: 18px;
      font-weight: bold;
      color: #0000CC;
      border-top: 1px dashed #ddd;
      padding-top: 8px;
      margin-top: 8px;
    }
    .submit-btn {
      width: 100%;
      background: #06c755;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }
    .submit-btn:active {
      background: #05b34c;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>專屬訂購單</h2>

  <!-- 💡 LINE 帳號顯示區塊 -->
  <div id="user-profile-box" class="user-profile">
    <img id="user-avatar" src="https://via.placeholder.com/40" alt="頭貼">
    <div class="user-info-text">
      <span>目前登入帳號</span>
      <strong id="user-name">正在讀取 LINE 身份...</strong>
    </div>
  </div>

  <!-- 公告說明區塊 -->
  <div class="notice-box">
    <strong>📢 訂購須知：</strong><br>
    本次訂購為12月取貨。先統計數量，在看怎麼安排取貨時間。<br>
    前方有"🎉"為本次新品，有興趣者歡迎選購！
  </div>

  <!-- 品項列表容器 -->
  <div id="product-list"></div>

  <!-- 結算資訊區塊 -->
  <div class="checkout-summary">
    <div class="summary-row total-qty">
      <span>總數量：</span>
      <span><strong id="total-qty">0</strong> 顆</span>
    </div>
    <div class="summary-row total-amount">
      <span>總金額：</span>
      <span id="total-amount">NT$0 元</span>
    </div>
  </div>

  <button class="submit-btn" onclick="submitOrder()">確認送出訂單</button>
</div>

<script>
  const products = [
    { id: 1, name: "紅豆", price: 48, quantity: 0 },
    { id: 2, name: "芋泥", price: 48, quantity: 0 },
    { id: 3, name: "乳酪丁", price: 48, quantity: 0 },
    { id: 4, name: "花生", price: 48, quantity: 0 },
    { id: 5, name: "巧克力", price: 48, quantity: 0 },
    { id: 6, name: "奶酥", price: 53, quantity: 0 },
    { id: 7, name: "黑芝麻", price: 51, quantity: 0 },
    { id: 8, name: "綠豆", price: 51, quantity: 0 },
    { id: 9, name: "肉鬆", price: 51, quantity: 0 },
    { id: 10, name: "鹹蛋芋頭", price: 58, quantity: 0 },
    { id: 11, name: "蔓越莓乳酪丁", price: 58, quantity: 0 },
    { id: 12, name: "草莓奶酥", price: 58, quantity: 0 },
    { id: 13, name: "起司奶酥", price: 58, quantity: 0 },
    { id: 14, name: "🎉抹茶奶酥芋泥", price: 58, quantity: 0 },
    { id: 15, name: "🎉黑糖肉桂奶酥", price: 58, quantity: 0 },
    { id: 16, name: "🎉黑糖麻吉", price: 53, quantity: 0 }
  ];

  let lineProfile = { userId: "TEST_USER", displayName: "測試用戶" };

  // 初始化網頁與 LIFF
  window.onload = function() {
    renderProducts();
    initializeLiff("2012419596-l7jcyOIj"); 
  };

  function initializeLiff(liffId) {
    liff.init({ liffId: liffId })
      .then(() => {
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          liff.getProfile().then(profile => {
            lineProfile.userId = profile.userId;
            lineProfile.displayName = profile.displayName;
            
            // 💡 成功取得後，更新畫面上的名字與頭貼
            document.getElementById("user-name").innerText = profile.displayName;
            if (profile.pictureUrl) {
              document.getElementById("user-avatar").src = profile.pictureUrl;
            }
          }).catch(err => {
            console.error("取得 Profile 失敗", err);
            document.getElementById("user-name").innerText = "無法取得 LINE 帳號";
          });
        }
      })
      .catch(err => {
        console.error("LIFF 初始化失敗", err);
        document.getElementById("user-name").innerText = "測試模式 (未在LINE中開啟)";
      });
  }

  function renderProducts() {
    const listContainer = document.getElementById("product-list");
    listContainer.innerHTML = "";

    products.forEach((product, index) => {
      const card = document.createElement("div");
      card.className = "product-card";
      card.innerHTML = `
        <div class="product-info">
          <h3>${product.name}</h3>
          <p class="product-price">$${product.price}</p>
        </div>
        <div class="quantity-control">
          <button onclick="changeQty(${index}, -1)">-</button>
          <span id="qty-${index}">${product.quantity}</span>
          <button onclick="changeQty(${index}, 1)">+</button>
        </div>
      `;
      listContainer.appendChild(card);
    });
  }

  function changeQty(index, delta) {
    products[index].quantity += delta;
    if (products[index].quantity < 0) {
      products[index].quantity = 0;
    }
    document.getElementById(`qty-${index}`).innerText = products[index].quantity;
    updateSummary();
  }

  function updateSummary() {
    let totalQty = 0;
    let totalAmount = 0;

    products.forEach(p => {
      totalQty += p.quantity;
      totalAmount += p.quantity * p.price;
    });

    document.getElementById("total-qty").innerText = totalQty;
    document.getElementById("total-amount").innerText = `$${totalAmount}`;
  }

  function submitOrder() {
    const totalQty = products.reduce((sum, p) => sum + p.quantity, 0);
    if (totalQty === 0) {
      alert("請至少選擇一個商品再送出訂單！");
      return;
    }

    const orderData = {
      userId: lineProfile.userId,
      displayName: lineProfile.displayName,
      items: products,
      totalQty: totalQty,
      totalAmount: products.reduce((sum, p) => sum + (p.quantity * p.price), 0)
    };

    const GAS_URL = "https://script.google.com/macros/s/AKfycbxZflNqYLbreKzYventNg6gEjx7HNY8jlthE0S5rtame8XhnDsv15MFUWeGhK6wtjHGLw/exec";

    fetch(GAS_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(orderData)
    }).then(() => {
      alert("訂單已成功送出！感謝您的訂購。");
      products.forEach(p => p.quantity = 0);
      renderProducts();
      updateSummary();
    }).catch(err => {
      console.error("送出失敗", err);
      alert("送出失敗，請稍後再試。");
    });
  }
</script>

</body>
</html>
